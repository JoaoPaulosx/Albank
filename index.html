<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albank</title>
  <!-- Link corrigido dos Ícones do Font Awesome -->
  <link rel="stylesheet" href="https://cloudflare.com">
  <!-- Link para o arquivo CSS separado -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- INÍCIO DA SUBSTITUIÇÃO (Substitui a antiga div "login-container") -->
  <div class="card-wrapper">
    <div class="card-inner" id="card">
      
      <!-- FRENTE: SUA TELA DE LOGIN -->
      <div class="card-face card-front">
        <h1>Albank</h1>
        <p class="subtitle">Entre na sua conta</p>

        <form action="#">
          <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" placeholder="Usuário" required>
          </div>

          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="Senha" required>
          </div>

          <div class="options">
            <label>
              <input type="checkbox"> Lembrar Senha
            </label>
            <a href="#">Esqueceu sua senha?</a>
          </div>

          <button type="submit" class="btn-signin">Entrar</button>

          <div class="signup-link">
            Não tem uma conta? <a href="#" id="to-register">Inscrever-se</a>
          </div>
        </form>
      </div>

      <!-- VERSO: NOVA TELA DE CADASTRO -->
      <div class="card-face card-back">
        <h1>Albank</h1>
        <p class="subtitle">Crie sua conta</p>

        <form action="#">
          <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" placeholder="Nome completo" required>
          </div>

          <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" placeholder="E-mail" required>
          </div>

          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="Criar senha" required>
          </div>

          <button type="submit" class="btn-signin">Cadastrar</button>

          <div class="signup-link">
            Já tem uma conta? <a href="#" id="to-login">Entrar</a>
          </div>
        </form>
      </div>

    </div>
  </div>

  <!-- Arquivo JavaScript que faz o giro acontecer -->
  <script src="script.js"></script>
  <!-- FIM DA SUBSTITUIÇÃO -->

</body>
</html>
